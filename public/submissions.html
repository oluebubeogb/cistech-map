<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahp Submissions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent2: #22c55e;
      --danger: #ef4444;
      --radius: 10px;
      --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.2rem;
    }
    .brand i { color: var(--accent); }
    .header-actions a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
    }
    .header-actions a:hover { color: var(--accent); }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    h1 { font-size: 1.75rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filters button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card h3 { font-size: 1.05rem; }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.pending { background: #422006; color: #fbbf24; }
    .badge.approved { background: #052e16; color: #4ade80; }
    .badge.rejected { background: #450a0a; color: #f87171; }
    .desc { font-size: 0.9rem; color: var(--muted); margin: 8px 0; }
    .coords { font-size: 0.8rem; font-family: monospace; color: var(--muted); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-approve { background: var(--accent2); color: #052e16; }
    .btn-reject { background: var(--danger); color: #fff; }
    .btn-pending { background: var(--surface2); color: var(--text); border: 1px solid var(--border) !important; }
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <i class="fa-solid fa-inbox"></i>
      Mahp Submissions
    </div>
    <div class="header-actions">
      <a href="/"><i class="fa-solid fa-map"></i> View Map</a>
      <a href="/monitor"><i class="fa-solid fa-chart-line"></i> Monitor</a>
    </div>
  </header>

  <div class="container">
    <h1>User submissions</h1>
    <p class="subtitle">Review missing places, business listings, and map edit suggestions. Approve or reject each one.</p>

    <div class="filters">
      <button type="button" class="filter-btn active" data-status="">All</button>
      <button type="button" class="filter-btn" data-status="pending">Pending</button>
      <button type="button" class="filter-btn" data-status="approved">Approved</button>
      <button type="button" class="filter-btn" data-status="rejected">Rejected</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    let currentFilter = '';
    const listEl = document.getElementById('list');

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.status;
        load();
      });
    });

    async function load() {
      const q = currentFilter ? '?status=' + encodeURIComponent(currentFilter) : '';
      const res = await fetch('/api/submissions' + q);
      const data = await res.json();
      const items = data.submissions || [];
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">No submissions' + (currentFilter ? ' with status “' + currentFilter + '”' : '') + '.</div>';
        return;
      }
      listEl.innerHTML = items.map(s => {
        const typeLabel = s.type === 'business' ? 'Business' : (s.type === 'map_edit' ? 'Map edit' : 'Missing place');
        return `
          <div class="card" data-id="${s.id}">
            <div class="card-header">
              <div>
                <h3>${escapeHtml(s.name)}</h3>
                <div class="meta">${typeLabel} · ${s.category || 'general'} · ${new Date(s.ts).toLocaleString()}</div>
              </div>
              <span class="badge ${s.status}">${s.status}</span>
            </div>
            ${s.description ? '<p class="desc">' + escapeHtml(s.description) + '</p>' : ''}
            <div class="coords">${s.lat != null ? s.lat + ', ' + s.lon : 'No coordinates'}</div>
            <div class="actions">
              <button type="button" class="btn-approve" data-id="${s.id}" data-status="approved">Approve</button>
              <button type="button" class="btn-reject" data-id="${s.id}" data-status="rejected">Reject</button>
              <button type="button" class="btn-pending" data-id="${s.id}" data-status="pending">Reset to pending</button>
            </div>
          </div>`;
      }).join('');

      listEl.querySelectorAll('.actions button').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const status = btn.dataset.status;
          await fetch('/api/submissions/' + id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status, reviewedBy: 'admin' })
          });
          load();
        });
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    load();
  </script>
</body>
</html>
